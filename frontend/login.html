<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bejelentkezés – AFTR</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- Bejelentkezés: Tóth Adrián -->
  <header class="fejlec"><a class="logó" href="index.html">AFTR</a><a class="vissza" href="index.html">← Vissza a főoldalra</a></header>
  <main class="oldal">
    <section class="urlap-kartya">
      <p class="felirat">ÜDV ÚJRA</p>
      <h1>Bejelentkezés</h1>
      <p class="leiras">Lépj be az AFTR felületére.</p>
      <form>
        <label for="emailcim">E-mail-cím</label>
        <input id="emailcim" name="emailcim" type="email" placeholder="nev@email.hu" required>
        <label for="jelszo">Jelszó</label>
        <input id="jelszo" name="jelszo" type="password" placeholder="Jelszavad" required>
        <button type="button">Bejelentkezés</button>
      </form>
      <p class="valtogatas">Még nincs fiókod? <a href="register.html">Regisztráció</a></p>
      <p class="megjegyzes">Bemutatóverzió: az űrlap nem küld adatokat.</p>
    </section>
  </main>
</body>
</html>
